<!DOCTYPE html>
<html>
<head>
  <title>PDF Tool (Merge / Split)</title>
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
</head>
<body>
  <h2>PDF Tool</h2>
  
  <input type="file" id="pdfFiles" accept="application/pdf" multiple>
  <br><br>
  <button onclick="mergePDFs()">Merge PDFs</button>
  <button onclick="splitPDF()">Split First Page</button>
  
  <p id="status"></p>

  <script>
    async function mergePDFs() {
      const files = document.getElementById("pdfFiles").files;
      if (files.length < 2) {
        document.getElementById("status").innerText = "Select at least 2 PDFs.";
        return;
      }

      const mergedPdf = await PDFLib.PDFDocument.create();

      for (let file of files) {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await PDFLib.PDFDocument.load(arrayBuffer);
        const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
        copiedPages.forEach((page) => mergedPdf.addPage(page));
      }

      const mergedBytes = await mergedPdf.save();
      download(mergedBytes, "merged.pdf");
      document.getElementById("status").innerText = "Merged PDF created!";
    }

    async function splitPDF() {
      const file = document.getElementById("pdfFiles").files[0];
      if (!file) {
        document.getElementById("status").innerText = "Select a PDF.";
        return;
      }

      const arrayBuffer = await file.arrayBuffer();
      const pdf = await PDFLib.PDFDocument.load(arrayBuffer);
      const newPdf = await PDFLib.PDFDocument.create();
      const [firstPage] = await newPdf.copyPages(pdf, [0]);
      newPdf.addPage(firstPage);

      const splitBytes = await newPdf.save();
      download(splitBytes, "split.pdf");
      document.getElementById("status").innerText = "Split PDF created!";
    }

    function download(bytes, filename) {
      const blob = new Blob([bytes], { type: "application/pdf" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
    }
  </script>
</body>
</html>
